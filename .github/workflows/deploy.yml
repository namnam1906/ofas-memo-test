name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run typecheck

      # Applies any migrations under ./migrations that the remote D1
      # database hasn't seen yet (idempotent — tracked in a table inside
      # the database itself, so already-applied ones are skipped).
      # continue-on-error: this needs the D1:Edit permission on
      # CLOUDFLARE_API_TOKEN in addition to Workers Scripts:Edit — if that
      # permission isn't on the token yet, don't let it block the actual
      # Worker deploy below, which only needs Workers Scripts:Edit.
      - name: Apply D1 migrations
        id: d1_migrations
        continue-on-error: true
        run: npx wrangler d1 migrations apply ofas_memo --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Warn if D1 migrations failed
        if: steps.d1_migrations.outcome == 'failure'
        run: |
          echo "::warning::D1 migrations step failed (likely missing D1:Edit on CLOUDFLARE_API_TOKEN) — deploy continued anyway. Add D1:Edit to the token to fix this for future migrations."

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
