name = "ofas-memo"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
# Without this, `wrangler deploy` (every push to main, via GitHub Actions)
# wipes any variable added through the Cloudflare dashboard that isn't also
# listed in this file's [vars] below — e.g. ANTHROPIC_API_KEY, set via the
# dashboard rather than `wrangler secret put`. keep_vars=true stops that.
# (Real secrets set via `wrangler secret put`/dashboard "Secret" type are
# never touched by a deploy either way — this only matters for plain vars.)
keep_vars = true

# Serves everything in ./public that isn't matched by an /api/* route in
# src/index.ts (the frontend: index.html + the bundled docx generator).
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "ofas_memo"
database_id = "8ae481b3-3d7f-4364-9310-a90d518f61c4"

[vars]
# Which LLM backs /api/draft and /api/chat: "anthropic" or "gemini".
# The corresponding *_API_KEY must be set as a secret (never put keys here —
# this file is committed to the repo). See README "Setup" for exact commands.
LLM_PROVIDER = "anthropic"
ANTHROPIC_MODEL = "claude-opus-5"
GEMINI_MODEL = "gemini-2.5-flash"
# Basic per-IP abuse guard for the unauthenticated /api/* endpoints (this is
# the "Prototype" stage — no login yet, see README's security note).
RATE_LIMIT_MAX_REQUESTS = "20"
RATE_LIMIT_WINDOW_SECONDS = "600"
